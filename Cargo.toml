[package]
name = "tokenplay"
version = "0.1.0"
edition = "2021"
description = "Local, read-only TUI for observing Claude Code and Codex CLI sessions"
license = "MIT"
default-run = "tokenplay"

[[bin]]
name = "tokenplay"
path = "src/main.rs"

[dependencies]
ratatui = "0.29"
crossterm = "0.28"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time", "sync"] }
rusqlite = { version = "0.32", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = { version = "0.4", features = ["clock"] }
walkdir = "2"
dirs = "5"
anyhow = "1"

[profile.release]
lto = "thin"
strip = true
