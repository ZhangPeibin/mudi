[package]
name = "sessionmesh"
version = "0.1.0"
edition = "2021"
description = "Local, read-only TUI for observing Claude Code and Codex CLI sessions"
license = "MIT"
default-run = "sessionmesh"

[[bin]]
name = "sessionmesh"
path = "src/main.rs"

[dependencies]
ratatui = { version = "0.29", features = ["unstable-rendered-line-info"] }
ratatui-explorer = "=0.2.1"
crossterm = "0.28"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time", "sync"] }
rusqlite = { version = "0.32", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = { version = "0.4", features = ["clock"] }
walkdir = "2"
dirs = "5"
anyhow = "1"
unicode-width = "0.2"

[profile.release]
lto = "thin"
strip = true
